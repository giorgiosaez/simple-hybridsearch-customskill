[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "simple-hybridsearch-customskill"
version = "0.1.0"
description = "Standalone Azure AI Search ingestion, search, and indexer examples"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "azure-identity>=1.19,<2",
    "azure-search-documents>=11.6,<12",
    "azure-storage-blob>=12.24,<13",
    "openai>=2.54,<3",
    "pypdf>=6,<7",
    "beautifulsoup4>=4.12,<5",
    "tiktoken>=0.9,<1",
    "python-dotenv>=1.0,<2",
    "azure-ai-textanalytics>=5.3,<6",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "mypy>=1.14,<2"]
notebook = ["ipykernel>=6.29,<8", "nbformat>=5.10,<6", "nbclient>=0.10,<1"]
function = ["azure-functions>=1.21,<2"]

[tool.setuptools.packages.find]
include = ["rag_search*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint.per-file-ignores]
"[0-9][0-9]_*.py" = ["N999"]
"tests/test_notebook.py" = ["S102"]

[tool.mypy]
python_version = "3.12"
files = ["rag_search"]
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
